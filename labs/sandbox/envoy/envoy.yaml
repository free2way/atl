admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: edge_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: edge_routes
                  virtual_hosts:
                    - name: products
                      domains: ["*"]
                      routes:
                        - match: { path: "/fault" }
                          direct_response: { status: 503, body: { inline_string: "intentional edge failure\n" } }
                        - match:
                            prefix: "/"
                            headers: [{ name: "x-release", string_match: { exact: "green" } }]
                          route: { cluster: backend_green, timeout: 2s }
                        - match: { prefix: "/" }
                          route:
                            cluster: backend_blue
                            timeout: 2s
                            retry_policy: { retry_on: "5xx,connect-failure", num_retries: 2 }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      http_service:
                        server_uri: { uri: "http://authz:9000", cluster: authz, timeout: 0.5s }
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - { exact: authorization }
                              - { exact: x-tenant-id }
                              - { exact: x-enable-rate-limit }
                        authorization_response:
                          allowed_upstream_headers:
                            patterns: [{ exact: x-current-user }]
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: authz
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: authz
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: authz, port_value: 9000 } } } }] }]
    - name: backend_blue
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: backend_blue
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: backend-blue, port_value: 80 } } } }] }]
    - name: backend_green
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: backend_green
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: backend-green, port_value: 80 } } } }] }]
